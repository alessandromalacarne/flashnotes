name: Release Please

on:
  push:
    branches: [master]

# The action opens a release PR, then tags the merge and publishes the release.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json